- date: July 13-17, 2026
  headline: MoRPH Parcipation in the Joint SMB/ESMTB meeting in Graz Austria
  description: The Mathematics of Reaction Networks Philippines community actively participated in the 14th European Conference on Mathematical and Theoretical Biology (ECMTB 2026), a joint conference organized by the Society for Mathematical Biology (SMB) and the European Society for Mathematical and Theoretical Biology (ESMTB). The event took place from 13 to 17 July 2026 at the University of Graz in Graz, Austria.
               Minisymposium: "Applications of Reaction Networks" Bryan Hernandez (UP Diliman) and Noel Fortun (De La Salle University) co-organized a minisymposium entitled "Applications of Reaction Networks." The session featured a keynote address by Romain Yvinec, who presented "Mathematical Modeling to Infer Signaling Bias: Kinetics and Spatial Compartmentalization." Al Jay Lan Alamin (UP Diliman) also served as a speaker, presenting the talk, "CRNT Approaches in Modelling Carbon Dioxide Removal Through Direct Ocean Capture." The minisymposium also gathered a lineup of international speakers, including Chloe Weckel, Caner Kazanci, Diego Rojas La Luz, Romain Yvinec, Ahmad Mokhtar, and Rosemary Braun.
               Invited Talk in "Dynamical Analysis of Biochemical Reaction Networks"
               In another session, Bryan Hernandez was invited in the minisymposium "Dynamical Analysis of Biochemical Reaction Networks," organized by Balázs Boros (University of Szeged), Matthew Johnston (Lawrence Technological University), and Polly Yu (University of Illinois Urbana-Champaign). Hernandez presented joint work with Eduardo Mendoza (DLSU) titled "Structural Classification of Chemical Reaction Networks via Visual and Algebraic Decompositions and Its Implications to Steady State Analysis."
               Poster Presentation: Exequiel Jun Villejo (UP Diliman) presented a poster entitled "A Scalable Network-Based Parameterization of Positive Steady States for Dynamical Analysis of Biochemical Systems," co-authored with Bryan Hernandez and Aurelio de los Reyes V (UP Diliman). Villejo’s presentation drew support and engagement from the international reaction network theory community, who visited his poster session and gave stickers of support.
              Launch of the SMB Reaction Networks Subgroup
              The conference also marked a key milestone for the global community with the official launch and inaugural meeting of the SMB Reaction Networks Subgroup. During the session, the subgroup elected its officers and advisory committee while outlining future directions and initiatives for the field.
  pic: smb2026.png
  
- date: December 1, 2025
  headline: MoRPH paper finalist for Best Research Paper in the International Higher Education Research Forum 2025
  description: In the 8th International Higher Education Research Forum, Morph paper entitled "Analyzing Earth's Carbon Cycle Involving Biochar Carbon Sequestration via Kinetic Representation" was selected as finalist for Best Research Paper under the Sustainable Development and Environmental Innovation category.
  pic: BatStateU.png
  
- date: October 26, 2025
  headline: MoRPH Participation in the 23rd Annual Conference of China Society for Industrial and Applied Mathematics
  description: The 23rd Annual Conference of China Society for Industrial and Applied Mathematics was held from October 23 to 26, 2025, at Changsha, Nanjing, China. Angelyn Lao was invited by the organizers of the session to present her talk titled “Reaction Networks Approach of Modeling Biological and Disease Dynamics.” 
  pic: CSIAM-LAO.png
  
- date: July 24, 2025
  headline: Congratulations to Dr. Angelyn Lao - PAASE Rising Star Award
  description: MoRPH congratulates Angelyn Lao for receiving the "Philippine-American Academy of Science and Engineering Rising Star" at the 45th APAMS, held July 19-20, 2025, at the University of South Carolina.
  pic: PAASE-LAO.jpg
  
- date: July 24, 2025
  headline: MoRPH Participation in the 30th Applications of Computer Algebra (ACA 2025) in Heraklion, Greece.
  description: The 30th Applications of Computer Algebra (ACA 2025) conference was held from July 14 to 18, 2025, at the Cultural Conference Center of Heraklion on the island of Crete, Greece. Bryan Hernandez, a member of the Mathematics of Reaction Networks group in the Philippines, was invited by the organizers of the session to present his talk titled “Analyzing the Dynamics and Structure of Biochemical Reaction Networks via Network Decomposition.” His presentation highlighted the use of chemical reaction network decomposition to explore the structural properties and long-term dynamics of complex biochemical systems.
  pic: morph-bryan-greece.jpeg

- date: July 4, 2025
  headline: MoRPH Participation in the 18th East Asia SIAM Section Conference at De La Salle University, Philippines.
  description: During the 2025 EASIAM at De La Salle University, Angelyn Lao and Noel Fortun organized a symposium focused on "Mathematical Biology and Ecology." Noel Fortun and Piolo Gaspar delivered presentations on MoRPH research, while Alvin Sevilla and Jeffrey Imer Salim presented their work through posters on reaction networks and mathematical epidemiology.
  pic: EASIAM-MORPH.jpg

- date: June 30, 2025
  headline: Congratulations to Dr. May Anne Mata - 2025 OYS in Mathematics
  description: MoRPH extends its heartfelt congratulations to Dr. May Anne Mata for being named one of the 2025 Outstanding Young Scientists (OYS) in the field of Mathematics by the National Academy of Science and Technology, Philippines (NAST PHL).

- date: July 4, 2024
  headline: MoRPH led by Angelyn Lao organized a mini-symposium during the 2024 Joint Meeting of KSMB and SMB at Konkuk University.
  description: During the 2024 Joint Meeting of KSMB and SMB at Konkuk University, Angelyn Lao organized a MoRPH mini-symposium and chaired the session for "The Mathematics of Biochemical Reaction Networks" with talks given by Bryan Hernandez, Patrick Lubenia, Exequiel Jun Vecera Villejo , and Noel Fortun.
